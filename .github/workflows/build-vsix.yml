name: Build and Release VSIX

# Builds the .vsix on every push/PR to main (uploaded as a CI artifact), and on version tags
# (v*) additionally creates a GitHub Release with the .vsix attached.
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # required by softprops/action-gh-release to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Tagged releases must match the package.json version so the published artifact is unambiguous.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VER="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VER" != "$TAG" ]; then
            echo "::error::Git tag '${GITHUB_REF_NAME}' does not match package.json version '${PKG_VER}'. Bump the version before tagging."
            exit 1
          fi

      # vsce package runs `vscode:prepublish` (production esbuild build) and produces *.vsix.
      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-pptx-${{ github.sha }}
          path: '*.vsix'
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: publish to the VS Code Marketplace on tags. Enable by adding the VSCE_PAT secret
  # (Azure DevOps Personal Access Token with Marketplace > Manage) in the repo settings.
